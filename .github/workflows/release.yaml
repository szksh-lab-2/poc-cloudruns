name: release production
on:
  push:
    branches:
      - dummy # main
    paths:
      - "**/env.yaml"
jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
